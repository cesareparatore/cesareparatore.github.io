<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Pagina non trovata — Cesare Paratore</title>

  <meta
    name="description"
    content="La pagina richiesta non è disponibile. Torna all'inizio del sito di Cesare Paratore."
  >

  <meta name="robots" content="noindex, follow">

  <meta name="theme-color" content="#0B0B0A">

  <link rel="stylesheet" href="/css/style.css">

  <style>
    .error-page {
      min-height: 100svh;
      padding: calc(var(--header-h) + 8vh) var(--gutter) 8vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--light);
      text-align: center;
    }

    .error-content {
      width: min(100%, 48rem);
      display: grid;
      justify-items: center;
      gap: clamp(2rem, 6vh, 4rem);
    }

    .error-code {
      margin: 0;
      font-size: var(--display-xl);
      line-height: .88;
      letter-spacing: -.055em;
      font-weight: 500;
    }

    .error-copy {
      margin: 0;
      max-width: 38rem;
      font-size: var(--narrative);
      line-height: 1.52;
      letter-spacing: -.012em;
    }

    .error-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      background: var(--light);
      color: var(--bg);
      font-size: var(--micro);
      letter-spacing: .08em;
      transition:
        background-color .25s ease,
        color .25s ease,
        opacity .25s ease;
    }

    .error-back:hover,
    .error-back:focus-visible {
      background: var(--surface);
      color: var(--light);
    }

    .error-back:focus-visible {
      outline: 2px solid var(--light);
      outline-offset: 4px;
    }

    @media (max-width: 900px) {
      .error-page {
        padding-top: calc(var(--header-h) + 7vh);
        padding-bottom: 7vh;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="site-header">

    <a
      class="brand"
      href="/"
      aria-label="Cesare Paratore — torna all'inizio"
    >
      <img
        src="/assets/images/cp-mark.svg"
        alt="Cesare Paratore"
        width="44"
        height="44"
      >
    </a>

    <button
      class="menu-trigger"
      id="menuTrigger"
      type="button"
      aria-expanded="false"
      aria-controls="siteMenu"
    >
      MENU
    </button>

  </header>

  <!-- =====================================================
       MENU
       ===================================================== -->

  <div
    class="site-menu"
    id="siteMenu"
    aria-hidden="true"
  >

    <a
      class="menu-brand"
      href="/"
      aria-label="Cesare Paratore — torna all'inizio"
    >
      <img
        src="/assets/images/cp-mark.svg"
        alt="Cesare Paratore"
        width="44"
        height="44"
      >
    </a>

    <button
      class="menu-close"
      id="menuClose"
      type="button"
      aria-label="Chiudi menu"
    >
      CHIUDI
    </button>

    <nav
      class="menu-nav"
      aria-label="Navigazione principale"
    >
      <a href="/chi-sono/">CHI SONO</a>
      <a href="/sport/">SPORT</a>
      <a href="/scienze-motorie/">SCIENZE MOTORIE</a>
      <a href="/educazione/">EDUCAZIONE</a>
      <a href="/management/">MANAGEMENT</a>
      <a href="/digitale/">DIGITALE</a>
      <a href="/territorio/">TERRITORIO</a>
      <a href="/contatti/">CONTATTI</a>
    </nav>

  </div>

  <!-- =====================================================
       404
       ===================================================== -->

  <main class="error-page">

    <div class="error-content">

      <p class="error-code">404</p>

      <p class="error-copy">
        Questa pagina non è dove pensavi di trovarla.
        <br>
        Ma forse è un buon momento per tornare a guardare.
      </p>

      <a
        class="error-back"
        href="/"
      >
        Torna all'inizio →
      </a>

    </div>

  </main>

  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="site-footer">

    <a
      class="footer-brand"
      href="/"
      aria-label="Cesare Paratore — torna all'inizio"
    >
      <img
        src="/assets/images/cp-mark.svg"
        alt="Cesare Paratore"
        width="44"
        height="44"
      >
    </a>

    <div class="footer-name">
      CESARE PARATORE
    </div>

  </footer>

  <script>
    (() => {
      "use strict";

      const menu = document.getElementById("siteMenu");
      const menuTrigger = document.getElementById("menuTrigger");
      const menuClose = document.getElementById("menuClose");

      function setMenu(open) {
        menu.classList.toggle("is-open", open);
        menu.setAttribute("aria-hidden", String(!open));
        menuTrigger.setAttribute("aria-expanded", String(open));
        document.body.classList.toggle("menu-open", open);

        if (open) {
          menu.style.visibility = "visible";
          menu.style.opacity = "1";
          menuClose.focus();
        } else {
          menu.style.visibility = "hidden";
          menu.style.opacity = "0";
          menuTrigger.focus();
        }
      }

      menuTrigger.addEventListener("click", () => {
        setMenu(true);
      });

      menuClose.addEventListener("click", () => {
        setMenu(false);
      });

      menu.addEventListener("click", (event) => {
        if (event.target === menu) {
          setMenu(false);
        }
      });

      menu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          setMenu(false);
        });
      });

      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          menu.classList.contains("is-open")
        ) {
          setMenu(false);
        }
      });
    })();
  </script>

</body>
</html>
