<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Pagina non trovata | Cesare Paratore</title>

  <meta
    name="robots"
    content="noindex, follow"
  >

  <meta
    name="theme-color"
    content="#0B1F33"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="error-page">

    <div class="error-content">

      <div class="error-brand">
        <img
          src="assets/cp-mark.png"
          width="56"
          height="56"
          alt="CP"
        >

        <span>CESARE PARATORE</span>
      </div>

      <p class="error-code">
        404
      </p>

      <h1>
        QUESTA DIREZIONE
        <span>NON ESISTE.</span>
      </h1>

      <p class="error-description">
        La pagina che stai cercando non è disponibile
        oppure l'indirizzo non è corretto.
      </p>

      <a class="error-button" href="/">
        TORNA ALLA HOME
        <span aria-hidden="true">→</span>
      </a>

    </div>

  </main>

</body>
</html>
