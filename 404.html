<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — Questa strada non porta qui. | Cesare Paratore</title>
  <meta
    name="description"
    content="La traiettoria si è interrotta. Torna all'inizio e riparti da un nuovo punto."
  >

  <meta name="theme-color" content="#F2EFE8">
  <meta name="color-scheme" content="light">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  >

  <link rel="icon" href="/assets/images/cp-mark.png" type="image/png">

  <style>
    :root {
      --ivory: #F2EFE8;
      --ink: #11110F;
      --terracotta: #A64232;
      --sand: #C9C0AF;
      --stone: #77736B;
      --white: #FFFDF8;

      --font-serif: "Instrument Serif", Georgia, serif;
      --font-sans: "DM Sans", Arial, sans-serif;
      --font-mono: "DM Mono", monospace;

      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-in-out: cubic-bezier(.65, 0, .35, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      background: var(--ivory);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    a {
      font: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--terracotta);
      outline-offset: 6px;
    }

    .error-page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .error-header {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 108px;
      padding: 12px 28px 10px;

      border-bottom: 1px solid rgba(17, 17, 15, .08);
    }

    .error-brand {
      display: block;

      width: 48px;
      height: 48px;
    }

    .error-brand img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .error-context {
      color: var(--stone);

      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* =====================================================
       MAIN
       ===================================================== */

    .error-main {
      position: relative;
      z-index: 1;

      flex: 1;

      display: flex;
      align-items: center;

      width: min(100%, 1680px);
      margin: 0 auto;
      padding: 90px 48px 110px;
    }

    .error-content {
      position: relative;

      width: 100%;
      max-width: 1120px;
    }

    .error-number {
      display: block;

      margin-bottom: 26px;

      color: var(--terracotta);

      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
    }

    .error-title {
      max-width: 980px;

      margin: 0;

      font-family: var(--font-serif);
      font-size: clamp(64px, 9.5vw, 150px);
      font-weight: 400;
      line-height: .88;
      letter-spacing: -.04em;
    }

    .error-title span {
      display: block;
    }

    .error-title span:last-child {
      margin-left: clamp(32px, 8vw, 140px);
      color: var(--terracotta);
    }

    .error-description {
      max-width: 620px;

      margin: 54px 0 0;

      font-size: clamp(17px, 1.45vw, 21px);
      line-height: 1.65;
    }

    .error-restart {
      max-width: 560px;

      margin: 44px 0 0;

      color: var(--stone);

      font-family: var(--font-serif);
      font-size: clamp(27px, 3vw, 44px);
      line-height: 1.08;
    }

    /* =====================================================
       TRAJECTORY
       ===================================================== */

    .error-trajectory {
      position: absolute;

      left: 48%;
      right: -3%;

      top: 57%;

      height: 190px;

      pointer-events: none;
      z-index: -1;
    }

    .error-trajectory-line {
      position: absolute;

      left: 0;
      top: 50%;

      width: 88%;
      height: 1px;

      background: var(--sand);

      transform:
        translateY(-50%)
        rotate(-9deg);

      transform-origin: left center;
    }

    .error-trajectory-line::after {
      content: "";

      position: absolute;

      left: 43%;
      top: 0;

      width: 38%;
      height: 1px;

      background: var(--sand);

      transform: rotate(18deg);
      transform-origin: left center;
    }

    .error-trajectory-point {
      position: absolute;

      left: 81%;
      top: 47%;

      width: 13px;
      height: 13px;

      border-radius: 50%;

      background: var(--terracotta);

      transform: translate(-50%, -50%);
    }

    .error-trajectory-end {
      position: absolute;

      left: 88%;
      top: 59%;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: var(--stone);
    }

    /* =====================================================
       CTA
       ===================================================== */

    .error-actions {
      margin-top: 58px;
    }

    .error-cta {
      display: inline-flex;
      align-items: center;
      gap: 13px;

      min-height: 48px;

      color: var(--ink);

      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .035em;
    }

    .error-cta-arrow {
      color: var(--terracotta);

      font-size: 15px;

      transition:
        transform .4s var(--ease-out);
    }

    .error-cta:hover,
    .error-cta:focus-visible {
      color: var(--terracotta);
    }

    .error-cta:hover .error-cta-arrow,
    .error-cta:focus-visible .error-cta-arrow {
      transform: translateX(7px);
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    .error-footer {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 76px;
      padding: 20px 28px;

      border-top: 1px solid rgba(17, 17, 15, .08);
    }

    .error-footer-mark {
      color: var(--stone);

      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .08em;
    }

    .error-footer-copy {
      color: var(--stone);

      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* =====================================================
       TABLET
       ===================================================== */

    @media (max-width: 1024px) {
      .error-main {
        padding:
          80px 36px
          100px;
      }

      .error-trajectory {
        left: 42%;
        right: -12%;
        top: 60%;
      }
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 820px) {
      .error-page {
        min-height: 100svh;
      }

      .error-header {
        min-height: 82px;
        padding: 12px 16px;
      }

      .error-brand {
        width: 40px;
        height: 40px;
      }

      .error-context {
        font-size: 9px;
      }

      .error-main {
        align-items: flex-start;

        width: 100%;
        padding:
          72px 20px
          90px;
      }

      .error-content {
        width: 100%;
      }

      .error-number {
        margin-bottom: 22px;
        font-size: 9px;
      }

      .error-title {
        max-width: 100%;

        font-size: clamp(58px, 16vw, 100px);
        line-height: .87;
      }

      .error-title span:last-child {
        margin-left: 10vw;
      }

      .error-description {
        max-width: 540px;

        margin-top: 42px;

        font-size: 17px;
        line-height: 1.65;
      }

      .error-restart {
        max-width: 500px;

        margin-top: 36px;

        font-size: clamp(28px, 8vw, 40px);
      }

      /*
       * La traiettoria non viene eliminata:
       * su mobile diventa un elemento laterale
       * che accompagna il contenuto senza attraversarlo.
       */
      .error-trajectory {
        position: relative;

        left: auto;
        right: auto;
        top: auto;

        width: 100%;
        height: 100px;

        margin-top: 48px;

        z-index: 0;
      }

      .error-trajectory-line {
        left: 4%;
        top: 44%;

        width: 82%;

        transform:
          translateY(-50%)
          rotate(-6deg);
      }

      .error-trajectory-line::after {
        left: 48%;
        width: 32%;

        transform: rotate(14deg);
      }

      .error-trajectory-point {
        left: 80%;
        top: 40%;
      }

      .error-trajectory-end {
        left: 91%;
        top: 61%;
      }

      .error-actions {
        margin-top: 40px;
      }

      .error-footer {
        min-height: 64px;
        padding: 16px 20px;
      }

      .error-footer-copy {
        text-align: right;
      }
    }

    /* =====================================================
       NARROW
       ===================================================== */

    @media (max-width: 420px) {
      .error-header {
        padding-inline: 14px;
      }

      .error-context {
        max-width: 150px;
        text-align: right;
        line-height: 1.3;
      }

      .error-main {
        padding:
          58px 16px
          76px;
      }

      .error-title {
        font-size: clamp(52px, 16vw, 78px);
      }

      .error-title span:last-child {
        margin-left: 8vw;
      }

      .error-description {
        margin-top: 36px;
        font-size: 16px;
      }

      .error-restart {
        font-size: 29px;
      }

      .error-trajectory {
        height: 82px;
        margin-top: 38px;
      }

      .error-cta {
        font-size: 10px;
      }

      .error-footer {
        align-items: flex-end;
        gap: 20px;
      }

      .error-footer-copy {
        max-width: 150px;
      }
    }

    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: .001ms !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    /* =====================================================
       PRINT
       ===================================================== */

    @media print {
      .error-page {
        min-height: auto;
      }

      .error-main {
        padding: 60px 0;
      }

      .error-trajectory {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="error-page">

    <header class="error-header">
      <a
        class="error-brand"
        href="/"
        aria-label="Cesare Paratore — torna all'inizio"
      >
        <img
          src="/assets/images/cp-mark.png"
          alt="Cesare Paratore"
          width="48"
          height="48"
        >
      </a>

      <span class="error-context">
        MOVIMENTO / CON DIREZIONE.
      </span>
    </header>


    <main class="error-main">
      <div class="error-content">

        <span class="error-number">404</span>

        <h1 class="error-title">
          <span>QUESTA STRADA</span>
          <span>NON PORTA QUI.</span>
        </h1>

        <p class="error-description">
          La traiettoria si è interrotta. La pagina che cercavi non esiste,
          oppure ha cambiato direzione.
        </p>

        <p class="error-restart">
          Non tutte le traiettorie arrivano dove pensavi.<br>
          Ma ogni percorso ha un punto da cui ripartire.
        </p>

        <div class="error-trajectory" aria-hidden="true">
          <span class="error-trajectory-line"></span>
          <span class="error-trajectory-point"></span>
          <span class="error-trajectory-end"></span>
        </div>

        <div class="error-actions">
          <a class="error-cta" href="/">
            <span>TORNA ALL'INIZIO</span>
            <span class="error-cta-arrow" aria-hidden="true">→</span>
          </a>
        </div>

      </div>
    </main>


    <footer class="error-footer">
      <span class="error-footer-mark">CP</span>

      <span class="error-footer-copy">
        CESARE PARATORE
      </span>
    </footer>

  </div>

</body>
</html>
