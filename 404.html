<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#071b33"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>404 | Cesare Paratore</title>

  <link
    rel="icon"
    type="image/png"
    href="/assets/images/cp-mark.png"
  >

  <style>
    :root {
      --navy: #071b33;
      --white: #ffffff;
      --paper: #f5f4ef;
      --muted: rgba(255, 255, 255, .56);
      --line: rgba(255, 255, 255, .13);

      --gutter: clamp(20px, 4vw, 72px);

      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--navy);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;

      background: var(--navy);
      color: var(--white);

      font-family:
        "Manrope",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;

      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    ::selection {
      background: var(--white);
      color: var(--navy);
    }


    /* ========================================================
       TOPBAR
       ======================================================== */

    .topbar {
      position: fixed;
      z-index: 20;

      top: 0;
      left: 0;

      width: 100%;
      height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0
        max(var(--gutter), env(safe-area-inset-right))
        0
        max(var(--gutter), env(safe-area-inset-left));

      background: var(--paper);
      color: var(--navy);
    }

    .brand {
      display: inline-flex;
      align-items: center;
    }

    .brand img {
      width: 43px;
      height: 43px;
      object-fit: contain;
    }

    .brand-text {
      margin-left: 14px;

      font-family:
        "DM Mono",
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: .62rem;
      line-height: 1.1;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .top-index {
      font-family:
        "DM Mono",
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: .62rem;
      letter-spacing: .08em;
      text-transform: uppercase;

      opacity: .5;
    }


    /* ========================================================
       BACKGROUND SYSTEM
       ======================================================== */

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .grid {
      position: absolute;
      inset: 0;

      opacity: .42;

      background-image:
        linear-gradient(
          to right,
          rgba(255,255,255,.045) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          rgba(255,255,255,.045) 1px,
          transparent 1px
        );

      background-size:
        clamp(70px, 9vw, 150px)
        clamp(70px, 9vw, 150px);

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 18%,
          black 80%,
          transparent
        );
    }

    .orbit {
      position: absolute;

      border: 1px solid var(--line);
      border-radius: 50%;

      animation:
        drift 18s ease-in-out infinite alternate;
    }

    .orbit-a {
      width: min(72vw, 1000px);
      aspect-ratio: 1;

      top: 4%;
      right: -27%;
    }

    .orbit-b {
      width: min(48vw, 680px);
      aspect-ratio: 1;

      top: 24%;
      right: -4%;

      animation-duration: 24s;
    }

    .orbit-c {
      width: min(25vw, 360px);
      aspect-ratio: 1;

      top: 42%;
      right: 15%;

      animation-duration: 13s;
    }

    @keyframes drift {
      from {
        transform: translate3d(-10px, -6px, 0);
      }

      to {
        transform: translate3d(12px, 9px, 0);
      }
    }

    .node {
      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: var(--white);

      box-shadow:
        0 0 0 10px rgba(255,255,255,.035);
    }

    .node-a {
      top: 27%;
      right: 23%;
    }

    .node-b {
      top: 62%;
      right: 11%;
    }

    .node-c {
      top: 72%;
      right: 32%;
    }


    /* ========================================================
       MAIN
       ======================================================== */

    main {
      position: relative;
      z-index: 5;

      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;

      padding:
        130px
        var(--gutter)
        100px;
    }

    .content {
      width: min(1180px, 100%);
      margin-inline: auto;
    }

    .eyebrow {
      margin: 0 0 28px;

      color: var(--muted);

      font-family:
        "DM Mono",
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .error-number {
      margin: 0;

      color: rgba(255,255,255,.08);

      font-family:
        "Manrope",
        system-ui,
        sans-serif;

      font-size:
        clamp(9rem, 27vw, 30rem);

      font-weight: 800;
      line-height: .68;

      letter-spacing: -.11em;

      user-select: none;
    }

    .message {
      position: relative;

      width: min(850px, 100%);

      margin-top: clamp(35px, 5vw, 65px);
    }

    h1 {
      margin: 0;

      font-size:
        clamp(3.3rem, 8vw, 8.5rem);

      font-weight: 800;
      line-height: .83;

      letter-spacing: -.085em;
    }

    h1 span {
      display: block;

      color: rgba(255,255,255,.48);

      font-weight: 500;
    }

    .description {
      max-width: 520px;

      margin:
        clamp(35px, 5vw, 60px)
        0
        0;

      color: rgba(255,255,255,.68);

      font-size:
        clamp(1rem, 1.5vw, 1.3rem);

      line-height: 1.45;
      letter-spacing: -.02em;
    }


    /* ========================================================
       ACTION
       ======================================================== */

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;

      width: min(470px, 100%);

      margin-top: 45px;
      padding: 20px 0;

      border-top: 1px solid rgba(255,255,255,.3);
      border-bottom: 1px solid rgba(255,255,255,.3);

      font-size:
        clamp(1.3rem, 2.3vw, 2rem);

      font-weight: 800;
      letter-spacing: -.045em;

      transition:
        border-color 500ms var(--ease),
        color 500ms var(--ease);
    }

    .home-link span {
      transition:
        transform 650ms var(--ease);
    }

    .home-link:hover {
      border-color: var(--white);
    }

    .home-link:hover span {
      transform: translate(7px, -7px);
    }


    /* ========================================================
       FOOTER
       ======================================================== */

    .footer {
      position: fixed;
      z-index: 10;

      right: var(--gutter);
      bottom: max(25px, env(safe-area-inset-bottom));
      left: var(--gutter);

      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      gap: 30px;

      font-family:
        "DM Mono",
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: .58rem;
      line-height: 1.4;

      letter-spacing: .08em;
      text-transform: uppercase;

      color: rgba(255,255,255,.42);
    }

    .footer strong {
      display: block;

      margin-bottom: 5px;

      color: var(--white);

      font-weight: 500;
    }

    .footer-right {
      text-align: right;
    }


    /* ========================================================
       FOCUS
       ======================================================== */

    a:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 7px;
    }


    /* ========================================================
       MOBILE
       ======================================================== */

    @media (max-width: 700px) {

      .topbar {
        height: 68px;
      }

      .brand img {
        width: 36px;
        height: 36px;
      }

      .brand-text {
        display: none;
      }

      .top-index {
        font-size: .55rem;
      }

      main {
        align-items: flex-start;

        padding:
          150px
          20px
          110px;
      }

      .error-number {
        font-size:
          clamp(7rem, 34vw, 13rem);
      }

      .message {
        margin-top: 35px;
      }

      h1 {
        font-size:
          clamp(3.15rem, 16vw, 6rem);
      }

      .description {
        max-width: 410px;

        margin-top: 30px;

        font-size: 1rem;
      }

      .home-link {
        margin-top: 35px;
      }

      .orbit-a {
        width: 120vw;
        top: 22%;
        right: -72%;
      }

      .orbit-b {
        width: 78vw;
        top: 39%;
        right: -35%;
      }

      .orbit-c {
        width: 45vw;
        top: 52%;
        right: 0;
      }

      .footer {
        font-size: .5rem;
      }

      .footer-right {
        display: none;
      }
    }


    /* ========================================================
       SMALL PHONES
       ======================================================== */

    @media (max-width: 390px) {

      main {
        padding-top: 135px;
      }

      .error-number {
        font-size: 7rem;
      }

      h1 {
        font-size: 3.05rem;
      }

      .description {
        font-size: .95rem;
      }
    }


    /* ========================================================
       LANDSCAPE
       ======================================================== */

    @media (max-height: 560px) and (orientation: landscape) {

      main {
        padding-top: 110px;
      }

      .error-number {
        font-size: 8rem;
      }

      h1 {
        font-size: 3.5rem;
      }

      .description {
        margin-top: 20px;
      }

      .home-link {
        margin-top: 25px;
      }
    }


    /* ========================================================
       REDUCED MOTION
       ======================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <a
      class="brand"
      href="/"
      aria-label="Cesare Paratore — torna alla home"
    >
      <img
        src="/assets/images/cp-mark.png"
        alt="Cesare Paratore"
      >

      <span class="brand-text">
        CESARE PARATORE
      </span>
    </a>

    <span class="top-index">
      404 / MOVIMENTO
    </span>

  </header>


  <div class="scene" aria-hidden="true">

    <div class="grid"></div>

    <div class="orbit orbit-a"></div>
    <div class="orbit orbit-b"></div>
    <div class="orbit orbit-c"></div>

    <div class="node node-a"></div>
    <div class="node node-b"></div>
    <div class="node node-c"></div>

  </div>


  <main>

    <div class="content">

      <p class="eyebrow">
        404 / FUORI TRAIETTORIA
      </p>

      <p class="error-number" aria-hidden="true">
        404
      </p>

      <div class="message">

        <h1>
          QUESTA STRADA
          <span>NON ESISTE.</span>
        </h1>

        <p class="description">
          La pagina che stai cercando non è qui.
          Ma il percorso continua.
        </p>

        <a
          class="home-link"
          href="/"
          aria-label="Torna alla home di Cesare Paratore"
        >
          <span>
            TORNA AL PUNTO DI PARTENZA.
          </span>

          <span aria-hidden="true">
            ↗
          </span>
        </a>

      </div>

    </div>

  </main>


  <footer class="footer">

    <div>
      <strong>CESARE PARATORE</strong>
      MOVIMENTO / CON DIREZIONE.
    </div>

    <div class="footer-right">
      PARTINICO · SICILIA
    </div>

  </footer>

</body>
</html>
