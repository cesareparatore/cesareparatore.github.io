<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pagina non trovata | Cesare Paratore</title>

  <meta
    name="description"
    content="La pagina che stai cercando non è disponibile. Torna al percorso di Cesare Paratore."
  >

  <meta
    name="robots"
    content="noindex, follow"
  >

  <link
    rel="icon"
    type="image/png"
    href="/assets/images/cp-mark.png"
  >

  <style>
    :root {
      --navy: #071b33;
      --navy-2: #0d2949;
      --white: #ffffff;
      --paper: #f5f4ef;
      --line: rgba(255, 255, 255, 0.14);
      --muted: rgba(255, 255, 255, 0.62);
      --mono: "DM Mono", monospace;
      --sans: "Manrope", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--navy);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: var(--sans);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .error-page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }

    /* ======================================================
       BACKGROUND
       ====================================================== */

    .error-grid {
      position: absolute;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      opacity: 0.7;

      background-image:
        linear-gradient(
          to right,
          var(--line) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          var(--line) 1px,
          transparent 1px
        );

      background-size:
        8vw 8vw,
        8vw 8vw;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 18%,
          black 82%,
          transparent
        );
    }

    .error-orbit {
      position: absolute;
      width: min(70vw, 900px);
      aspect-ratio: 1;
      right: -22vw;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      z-index: -2;
      pointer-events: none;
    }

    .error-orbit::before,
    .error-orbit::after {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }

    .error-orbit::after {
      inset: 28%;
    }

    .error-glow {
      position: absolute;
      width: 45vw;
      height: 45vw;
      max-width: 700px;
      max-height: 700px;
      right: -12vw;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.08),
          transparent 68%
        );
      filter: blur(20px);
      z-index: -3;
      pointer-events: none;
    }


    /* ======================================================
       TOP BAR
       ====================================================== */

    .error-topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 86px;
      padding:
        18px
        clamp(20px, 4vw, 72px);

      background: var(--paper);
      color: var(--navy);
    }

    .error-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 76px;
      height: 76px;

      transition:
        transform 500ms cubic-bezier(.16, 1, .3, 1);
    }

    .error-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .error-logo:hover {
      transform: scale(1.06);
    }

    .error-home {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .error-home::after {
      content: "↗";

      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 34px;
      height: 34px;

      border: 1px solid rgba(7, 27, 51, 0.22);
      border-radius: 50%;

      transition:
        transform 400ms cubic-bezier(.16, 1, .3, 1);
    }

    .error-home:hover::after {
      transform: translate(3px, -3px);
    }


    /* ======================================================
       MAIN
       ====================================================== */

    .error-main {
      min-height: 100vh;
      min-height: 100svh;

      display: grid;
      grid-template-columns:
        minmax(0, 1.1fr)
        minmax(280px, 0.9fr);

      align-items: center;

      gap: clamp(40px, 8vw, 140px);

      padding:
        140px
        clamp(20px, 8vw, 140px)
        100px;
    }

    .error-copy {
      max-width: 850px;
    }

    .error-kicker {
      margin: 0 0 28px;

      font-family: var(--mono);
      font-size: 0.7rem;
      line-height: 1.5;
      letter-spacing: 0.16em;
      text-transform: uppercase;

      color: var(--muted);
    }

    .error-title {
      margin: 0;

      font-size:
        clamp(4.5rem, 11vw, 11rem);

      line-height: 0.82;
      letter-spacing: -0.075em;
      font-weight: 700;
    }

    .error-title span {
      display: block;
    }

    .error-title span:last-child {
      color: transparent;
      -webkit-text-stroke:
        1px rgba(255, 255, 255, 0.7);
    }

    .error-description {
      max-width: 560px;
      margin: 42px 0 0;

      font-size:
        clamp(1.05rem, 1.5vw, 1.4rem);

      line-height: 1.55;
      color: rgba(255, 255, 255, 0.78);
    }

    .error-action {
      display: inline-flex;
      align-items: center;
      gap: 18px;

      margin-top: 42px;
      padding: 16px 22px;

      border: 1px solid
        rgba(255, 255, 255, 0.28);

      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      transition:
        background 400ms cubic-bezier(.16, 1, .3, 1),
        color 400ms cubic-bezier(.16, 1, .3, 1),
        transform 400ms cubic-bezier(.16, 1, .3, 1);
    }

    .error-action::after {
      content: "→";
      font-size: 1rem;
    }

    .error-action:hover {
      background: var(--white);
      color: var(--navy);
      transform: translateX(5px);
    }


    /* ======================================================
       VISUAL MARK
       ====================================================== */

    .error-visual {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 360px;
    }

    .error-mark {
      position: relative;

      width:
        clamp(180px, 22vw, 330px);

      aspect-ratio: 1;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-mark::before {
      content: "";

      position: absolute;
      inset: 0;

      border:
        1px solid
        rgba(255, 255, 255, 0.18);

      border-radius: 50%;

      animation:
        errorOrbit 18s linear infinite;
    }

    .error-mark::after {
      content: "";

      position: absolute;
      inset: 13%;

      border:
        1px solid
        rgba(255, 255, 255, 0.08);

      border-radius: 50%;
    }

    .error-mark img {
      position: relative;
      z-index: 2;

      display: block;

      width: 48%;
      height: 48%;

      object-fit: contain;
    }


    /* ======================================================
       FOOTER
       ====================================================== */

    .error-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      padding:
        24px
        clamp(20px, 4vw, 72px);

      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.48);
    }

    .error-footer strong {
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }


    /* ======================================================
       MOTION
       ====================================================== */

    @keyframes errorOrbit {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* ======================================================
       TABLET
       ====================================================== */

    @media (max-width: 900px) {

      .error-main {
        grid-template-columns: 1fr;
        align-content: center;
        gap: 48px;
      }

      .error-visual {
        position: absolute;
        right: -100px;
        bottom: 80px;
        opacity: 0.35;
        pointer-events: none;
      }

      .error-mark {
        width: 360px;
      }
    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 600px) {

      body {
        overflow: auto;
      }

      .error-topbar {
        min-height: 72px;
        padding:
          12px 18px;
      }

      .error-logo {
        width: 62px;
        height: 62px;
      }

      .error-home {
        font-size: 0.58rem;
      }

      .error-home::after {
        width: 30px;
        height: 30px;
      }

      .error-main {
        min-height: 100svh;
        padding:
          125px
          20px
          100px;

        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;

        gap: 0;
      }

      .error-title {
        font-size:
          clamp(4.2rem, 22vw, 7rem);
      }

      .error-description {
        margin-top: 30px;
        font-size: 1rem;
      }

      .error-action {
        margin-top: 30px;
      }

      .error-visual {
        display: none;
      }

      .error-footer {
        padding:
          18px 20px;

        font-size: 0.54rem;
      }

      .error-footer span:last-child {
        display: none;
      }

      .error-grid {
        background-size:
          18vw 18vw,
          18vw 18vw;
      }
    }


    /* ======================================================
       REDUCED MOTION
       ====================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <div class="error-page">

    <div class="error-grid" aria-hidden="true"></div>
    <div class="error-orbit" aria-hidden="true"></div>
    <div class="error-glow" aria-hidden="true"></div>


    <header class="error-topbar">

      <a
        class="error-logo"
        href="/"
        aria-label="Torna alla home di Cesare Paratore"
      >
        <img
          src="/assets/images/cp-mark.png"
          alt="Cesare Paratore"
          width="76"
          height="76"
        >
      </a>

      <a
        class="error-home"
        href="/"
      >
        Torna al percorso
      </a>

    </header>


    <main class="error-main">

      <section
        class="error-copy"
        aria-labelledby="error-title"
      >

        <p class="error-kicker">
          Errore 404 / Percorso interrotto
        </p>

        <h1
          class="error-title"
          id="error-title"
        >
          <span>QUESTA STRADA</span>
          <span>NON ESISTE.</span>
        </h1>

        <p class="error-description">
          La pagina che stai cercando non è disponibile.
          Ma il percorso continua.
        </p>

        <a
          class="error-action"
          href="/"
        >
          Riparti dall'inizio
        </a>

      </section>


      <div
        class="error-visual"
        aria-hidden="true"
      >

        <div class="error-mark">

          <img
            src="/assets/images/cp-mark.png"
            alt=""
            width="330"
            height="330"
          >

        </div>

      </div>

    </main>


    <footer class="error-footer">

      <span>
        <strong>CESARE PARATORE</strong>
      </span>

      <span>
        MOVIMENTO / CON DIREZIONE.
      </span>

    </footer>

  </div>

</body>
</html>
