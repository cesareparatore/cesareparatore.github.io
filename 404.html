<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pagina non trovata — Cesare Paratore</title>

  <meta
    name="description"
    content="La pagina che stai cercando non è disponibile."
  >

  <meta name="robots" content="noindex, follow">

  <meta name="theme-color" content="#F1EFE8">

  <style>
    :root {
      --bg: #0B0B0A;
      --light: #F1EFE8;
      --secondary: #A7A49C;
      --muted: #66645F;

      --gutter: 5vw;
      --header-h: 76px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--light);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;

      background: var(--light);
      color: var(--bg);

      font-family:
        "Neue Montreal",
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;

      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .site-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 300;

      height: var(--header-h);
      padding: 0 var(--gutter);

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: var(--light);
      color: var(--bg);
    }

    .site-logo {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
    }

    .site-logo img {
      width: 100%;
      height: auto;
    }

    .menu-trigger {
      min-width: 92px;
      min-height: 44px;
      padding: 0 18px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--bg);

      background: var(--bg);
      color: var(--light);

      font-size: .8rem;
      line-height: 1;
      letter-spacing: .12em;
    }

    /* =====================================================
       MENU
       ===================================================== */

    .site-menu {
      position: fixed;
      top: var(--header-h);
      right: 0;
      bottom: 0;
      left: 0;

      z-index: 250;

      display: grid;
      place-items: center;

      padding: 48px var(--gutter);

      background: var(--bg);
      color: var(--light);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity .35s ease,
        visibility 0s linear .35s;
    }

    .site-menu.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;

      transition:
        opacity .35s ease,
        visibility 0s linear 0s;
    }

    .site-menu-nav {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: clamp(12px, 1.7vh, 24px);
    }

    .site-menu-nav a {
      color: var(--light);

      font-size: clamp(2rem, 5vw, 5rem);
      line-height: .95;
      letter-spacing: -.035em;
      text-align: center;

      transition: opacity .25s ease;
    }

    .site-menu-nav a:hover {
      opacity: .5;
    }

    /* =====================================================
       404
       ===================================================== */

    .error-page {
      min-height: 100svh;
      padding-top: var(--header-h);

      display: grid;
      grid-template-rows: 1fr auto;
    }

    .error-section {
      min-height: calc(100svh - var(--header-h));

      display: grid;
      place-items: center;

      padding: 8vh var(--gutter);
    }

    .error-content {
      width: min(100%, 820px);
      margin: 0 auto;

      text-align: center;
    }

    .error-code {
      margin: 0 0 clamp(28px, 4vh, 48px);

      color: var(--muted);

      font-size: .8rem;
      line-height: 1;
      letter-spacing: .14em;
    }

    .error-content h1 {
      margin: 0;

      font-size: clamp(3rem, 7vw, 7rem);
      line-height: .92;
      letter-spacing: -.045em;
      font-weight: 500;
    }

    .error-message {
      max-width: 42rem;
      margin: clamp(32px, 5vh, 56px) auto 0;

      color: var(--secondary);

      font-size: clamp(1.15rem, 1.35vw, 1.5rem);
      line-height: 1.5;
    }

    .error-link {
      display: inline-block;

      margin-top: clamp(36px, 6vh, 64px);
      padding-bottom: 8px;

      border-bottom: 1px solid var(--bg);

      font-size: .8rem;
      line-height: 1;
      letter-spacing: .12em;
      text-transform: uppercase;

      transition: opacity .25s ease;
    }

    .error-link:hover {
      opacity: .5;
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    .site-footer {
      min-height: 88px;

      padding: 24px var(--gutter);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 24px;

      background: var(--light);
      color: var(--bg);
    }

    .footer-logo {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
    }

    .footer-logo img {
      width: 100%;
      height: auto;
    }

    .site-footer span {
      font-size: .8rem;
      line-height: 1;
      letter-spacing: .12em;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 640px) {

      :root {
        --gutter: 20px;
        --header-h: 68px;
      }

      .site-logo {
        width: 38px;
        height: 38px;
      }

      .menu-trigger {
        min-width: 84px;
        min-height: 42px;
      }

      .site-menu {
        padding: 32px 20px;
      }

      .site-menu-nav {
        gap: 14px;
      }

      .site-menu-nav a {
        font-size: clamp(1.8rem, 9vw, 3rem);
      }

      .error-section {
        padding: 48px 20px;
      }

      .error-content h1 {
        font-size: clamp(2.8rem, 13vw, 4.5rem);
      }

      .error-message {
        font-size: 1.15rem;
      }

      .site-footer {
        min-height: 76px;
        padding: 20px;
      }
    }

    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      .site-menu,
      .site-menu-nav a,
      .error-link {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="site-header">

    <a
      class="site-logo"
      href="/"
      aria-label="Cesare Paratore — Home"
    >
      <img
        src="/assets/images/cp-mark.svg"
        alt="CP"
        width="42"
        height="42"
      >
    </a>

    <button
      class="menu-trigger"
      type="button"
      aria-expanded="false"
      aria-controls="site-menu"
    >
      MENU
    </button>

  </header>


  <!-- MENU -->

  <aside
    class="site-menu"
    id="site-menu"
    aria-hidden="true"
  >

    <nav
      class="site-menu-nav"
      aria-label="Navigazione principale"
    >

      <a href="/chi-sono/">CHI SONO</a>
      <a href="/sport/">SPORT</a>
      <a href="/scienze-motorie/">SCIENZE MOTORIE</a>
      <a href="/educazione/">EDUCAZIONE</a>
      <a href="/management/">MANAGEMENT</a>
      <a href="/digitale/">DIGITALE</a>
      <a href="/territorio/">TERRITORIO</a>
      <a href="/contatti/">CONTATTI</a>

    </nav>

  </aside>


  <!-- 404 -->

  <main class="error-page">

    <section
      class="error-section"
      aria-labelledby="error-title"
    >

      <div class="error-content">

        <p
          class="error-code"
          aria-hidden="true"
        >
          404
        </p>

        <h1 id="error-title">
          Questa pagina non è dove pensavi di trovarla.
        </h1>

        <p class="error-message">
          Ma forse è un buon momento per tornare a guardare.
        </p>

        <a
          class="error-link"
          href="/"
        >
          Torna all'inizio →
        </a>

      </div>

    </section>


    <!-- FOOTER -->

    <footer class="site-footer">

      <a
        class="footer-logo"
        href="/"
        aria-label="Cesare Paratore — Home"
      >
        <img
          src="/assets/images/cp-mark.svg"
          alt="CP"
          width="38"
          height="38"
        >
      </a>

      <span>CESARE PARATORE</span>

    </footer>

  </main>


  <!-- MENU SCRIPT -->

  <script>
    (() => {
      "use strict";

      const body = document.body;
      const trigger = document.querySelector(".menu-trigger");
      const menu = document.querySelector(".site-menu");
      const links = document.querySelectorAll(".site-menu-nav a");

      if (!trigger || !menu) {
        return;
      }

      const setMenu = (open) => {
        trigger.setAttribute(
          "aria-expanded",
          String(open)
        );

        menu.setAttribute(
          "aria-hidden",
          String(!open)
        );

        menu.classList.toggle(
          "is-open",
          open
        );

        body.classList.toggle(
          "menu-open",
          open
        );
      };

      trigger.addEventListener("click", () => {
        const open =
          trigger.getAttribute("aria-expanded") === "true";

        setMenu(!open);
      });

      links.forEach((link) => {
        link.addEventListener("click", () => {
          setMenu(false);
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          setMenu(false);
        }
      });
    })();
  </script>

</body>
</html>
