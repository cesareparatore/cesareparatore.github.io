<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0B0B0A">

  <title>404 — Cesare Paratore</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* ========================================================
       404 — COERENTE CON IL SISTEMA HOME
    ======================================================== */

    .page-404 {
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      background: var(--bg);
      color: var(--light);
    }

    .page-404__main {
      flex: 1;

      min-height: calc(100svh - 88px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        8rem
        var(--margin);
    }

    .page-404__inner {
      width: min(100%, 72rem);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .page-404__number {
      margin: 0;

      font-size: var(--display-xl);
      line-height: 0.82;
      letter-spacing: -0.07em;
      font-weight: 500;
    }

    .page-404__text {
      width: min(100%, 42rem);

      margin: 3rem auto 0;

      font-size: var(--narrative);
      line-height: 1.52;
      letter-spacing: -0.012em;
    }

    .page-404__text p {
      margin: 0 0 1.25em;
    }

    .page-404__text p:last-child {
      margin-bottom: 0;
    }

    .page-404__link {
      display: inline-flex;
      align-items: center;
      gap: 1rem;

      margin-top: 3rem;

      color: var(--light);

      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;

      border-bottom: 1px solid var(--light);
      padding-bottom: 0.45rem;

      transition:
        opacity 0.35s ease,
        transform 0.35s var(--ease);
    }

    .page-404__link:hover {
      opacity: 0.65;
      transform: translateY(-2px);
    }

    @media (max-width: 767px) {

      .page-404__main {
        min-height: calc(100svh - 72px);

        padding:
          7rem
          var(--margin);
      }

      .page-404__text {
        margin-top: 2.5rem;
      }

      .page-404__link {
        margin-top: 2.5rem;
      }

    }
  </style>
</head>

<body class="page-404">

  <!-- ======================================================
       HEADER
  ======================================================= -->

  <header class="site-header">

    <a
      class="site-header__logo"
      href="index.html#section-01"
      aria-label="Cesare Paratore"
    >
      <img
        src="assets/images/cp-mark.svg"
        alt="CP"
      >
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-menu"
    >
      MENU
    </button>

  </header>


  <!-- ======================================================
       MENU
  ======================================================= -->

  <aside
    class="site-menu"
    id="site-menu"
    aria-hidden="true"
  >

    <nav
      class="site-menu__nav"
      aria-label="Navigazione principale"
    >

      <a href="index.html#section-01">GUARDA.</a>
      <a href="index.html#section-02">COME?</a>
      <a href="index.html#section-03">MOVIMENTO.</a>
      <a href="index.html#section-04">CAPIRE.</a>
      <a href="index.html#section-05">TRASMETTERE.</a>
      <a href="index.html#section-06">COSTRUIRE.</a>
      <a href="index.html#section-07">RITORNA.</a>
      <a href="index.html#section-08">COLLEGARE.</a>
      <a href="index.html#section-09">OGGI.</a>
      <a href="index.html#section-10">OBIETTIVO.</a>
      <a href="index.html#section-11">QUI.</a>
      <a href="index.html#section-12">DA QUI.</a>
      <a href="index.html#section-13">ECCOMI.</a>
      <a href="index.html#section-14">SCRIVIMI.</a>

    </nav>

  </aside>


  <!-- ======================================================
       404
  ======================================================= -->

  <main class="page-404__main">

    <div class="page-404__inner">

      <h1 class="page-404__number">
        404
      </h1>

      <div class="page-404__text">

        <p>
          Questa pagina non è dove pensavi di trovarla.
        </p>

        <p>
          Ma forse è un buon momento per tornare a guardare.
        </p>

      </div>

      <a
        class="page-404__link"
        href="index.html#section-01"
      >
        Torna all'inizio
        <span aria-hidden="true">→</span>
      </a>

    </div>

  </main>


  <!-- ======================================================
       FOOTER
  ======================================================= -->

  <footer class="site-footer">

    <div class="site-footer__logo">
      <img
        src="assets/images/cp-mark.svg"
        alt="CP"
      >
    </div>

    <div class="site-footer__name">
      CESARE PARATORE
    </div>

  </footer>


  <!-- ======================================================
       MENU JS
  ======================================================= -->

  <script>
    (() => {
      "use strict";

      const menuToggle =
        document.querySelector(".menu-toggle");

      const siteMenu =
        document.getElementById("site-menu");

      const menuLinks =
        document.querySelectorAll(
          ".site-menu__nav a"
        );

      if (!menuToggle || !siteMenu) {
        return;
      }

      const openMenu = () => {
        siteMenu.classList.add("is-open");

        siteMenu.setAttribute(
          "aria-hidden",
          "false"
        );

        menuToggle.setAttribute(
          "aria-expanded",
          "true"
        );

        document.body.classList.add(
          "is-locked"
        );
      };

      const closeMenu = () => {
        siteMenu.classList.remove(
          "is-open"
        );

        siteMenu.setAttribute(
          "aria-hidden",
          "true"
        );

        menuToggle.setAttribute(
          "aria-expanded",
          "false"
        );

        document.body.classList.remove(
          "is-locked"
        );
      };

      menuToggle.addEventListener(
        "click",
        () => {

          if (
            siteMenu.classList.contains(
              "is-open"
            )
          ) {
            closeMenu();
          } else {
            openMenu();
          }

        }
      );

      menuLinks.forEach((link) => {
        link.addEventListener(
          "click",
          closeMenu
        );
      });

      document.addEventListener(
        "keydown",
        (event) => {

          if (
            event.key === "Escape"
          ) {
            closeMenu();
          }

        }
      );

    })();
  </script>

</body>
</html>
