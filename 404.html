<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>404 | Cesare Paratore | Movimento / Con Direzione.</title>

  <meta
    name="description"
    content="La pagina che stai cercando non è disponibile. Il percorso continua."
  >

  <meta
    name="robots"
    content="noindex, follow"
  >

  <link rel="icon" href="/assets/images/cp-mark.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       404 — CESARE PARATORE
       MOVIMENTO / CON DIREZIONE.
       ===================================================== */

    :root {
      --navy: #071b33;
      --navy-2: #0b2440;
      --navy-3: #12395d;

      --white: #ffffff;
      --paper: #f5f4ef;

      --line: rgba(255,255,255,.12);
      --line-soft: rgba(255,255,255,.07);

      --gutter: clamp(20px, 4vw, 72px);

      --ease-out: cubic-bezier(.16,1,.3,1);
      --ease-in-out: cubic-bezier(.65,0,.35,1);
    }


    /* =====================================================
       RESET
       ===================================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100%;
    }

    body {
      min-height: 100svh;

      overflow: hidden;

      background: var(--navy);
      color: var(--white);

      font-family:
        "Manrope",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    ::selection {
      background: var(--white);
      color: var(--navy);
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .error-page {
      position: relative;

      min-height: 100svh;
      min-height: 100dvh;

      display: grid;
      grid-template-rows: auto 1fr auto;

      overflow: hidden;
    }


    /* =====================================================
       ATMOSPHERE
       ===================================================== */

    .error-atmosphere {
      position: absolute;
      inset: 0;

      pointer-events: none;
      overflow: hidden;
    }

    .error-grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          to right,
          rgba(255,255,255,.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          rgba(255,255,255,.035) 1px,
          transparent 1px
        );

      background-size:
        clamp(48px, 6vw, 90px)
        clamp(48px, 6vw, 90px);

      mask-image:
        radial-gradient(
          circle at center,
          black 15%,
          transparent 78%
        );
    }

    .error-orbit {
      position: absolute;

      width: min(72vw, 900px);
      aspect-ratio: 1;

      left: 50%;
      top: 50%;

      border:
        1px solid rgba(255,255,255,.10);

      border-radius: 50%;

      transform:
        translate(-50%, -50%)
        rotate(-18deg);
    }

    .error-orbit::before,
    .error-orbit::after {
      content: "";

      position: absolute;

      border:
        1px solid rgba(255,255,255,.055);

      border-radius: 50%;
    }

    .error-orbit::before {
      inset: 12%;
    }

    .error-orbit::after {
      inset: 27%;
    }

    .error-glow {
      position: absolute;

      width: min(60vw, 800px);
      aspect-ratio: 1;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(18,57,93,.38),
          transparent 68%
        );

      filter: blur(25px);
    }

    .error-line {
      position: absolute;

      width: 80vw;
      height: 1px;

      left: 50%;
      top: 50%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.16),
          transparent
        );

      transform:
        translate(-50%, -50%)
        rotate(-23deg);
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .error-header {
      position: relative;
      z-index: 5;

      width:
        min(
          calc(100% - (var(--gutter) * 2)),
          1480px
        );

      margin-inline: auto;

      min-height: 86px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom:
        1px solid var(--line);
    }

    .error-logo {
      display: inline-flex;
      align-items: center;
    }

    .error-logo img {
      width: 60px;
      height: 60px;

      object-fit: contain;

      transition:
        transform 600ms var(--ease-out);
    }

    .error-logo:hover img {
      transform:
        rotate(-4deg)
        scale(1.06);
    }

    .error-header-label {
      font-family: "DM Mono", monospace;

      font-size: .66rem;
      letter-spacing: .11em;
      text-transform: uppercase;

      color: rgba(255,255,255,.42);
    }


    /* =====================================================
       MAIN
       ===================================================== */

    .error-main {
      position: relative;
      z-index: 3;

      width:
        min(
          calc(100% - (var(--gutter) * 2)),
          1480px
        );

      margin-inline: auto;

      display: grid;

      place-items: center;

      padding-block: 50px;
    }

    .error-content {
      width: min(100%, 1100px);

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(190px, .38fr);

      align-items: center;

      gap: clamp(45px, 9vw, 140px);
    }


    /* =====================================================
       COPY
       ===================================================== */

    .error-kicker {
      margin-bottom: 25px;

      font-family: "DM Mono", monospace;

      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;

      color: rgba(255,255,255,.38);
    }

    .error-title {
      margin: 0;

      font-size:
        clamp(5rem, 13vw, 13rem);

      line-height: .78;

      letter-spacing: -.09em;

      font-weight: 600;
    }

    .error-title span {
      display: block;
    }

    .error-title span:last-child {
      color: rgba(255,255,255,.27);
    }

    .error-copy {
      max-width: 560px;

      margin-top: 45px;

      font-size:
        clamp(1.05rem, 1.5vw, 1.35rem);

      line-height: 1.65;

      color: rgba(255,255,255,.64);
    }

    .error-action {
      display: inline-flex;
      align-items: center;
      gap: 18px;

      margin-top: 38px;

      padding: 16px 21px;

      border:
        1px solid rgba(255,255,255,.24);

      border-radius: 999px;

      font-family: "DM Mono", monospace;

      font-size: .65rem;
      letter-spacing: .1em;
      text-transform: uppercase;

      transition:
        background 400ms var(--ease-out),
        color 400ms var(--ease-out),
        transform 400ms var(--ease-out);
    }

    .error-action::after {
      content: "↗";

      font-size: 15px;

      transition:
        transform 400ms var(--ease-out);
    }

    .error-action:hover {
      background: var(--white);
      color: var(--navy);

      transform:
        translateY(-4px);
    }

    .error-action:hover::after {
      transform:
        translate(4px, -4px);
    }


    /* =====================================================
       CENTRAL VISUAL
       ===================================================== */

    .error-visual {
      position: relative;

      width: min(100%, 380px);
      aspect-ratio: 1;

      margin-inline: auto;

      display: grid;
      place-items: center;
    }

    .error-visual-ring {
      position: absolute;
      inset: 0;

      border:
        1px solid rgba(255,255,255,.13);

      border-radius: 50%;

      animation:
        orbit 24s linear infinite;
    }

    .error-visual-ring::before {
      content: "";

      position: absolute;

      width: 8px;
      height: 8px;

      top: 10%;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 50%;

      background: var(--white);

      box-shadow:
        0 0 0 8px rgba(255,255,255,.06);
    }

    .error-visual-ring-inner {
      position: absolute;
      inset: 16%;

      border:
        1px solid rgba(255,255,255,.09);

      border-radius: 50%;
    }

    .error-visual-core {
      position: relative;
      z-index: 3;

      width: 46%;
      aspect-ratio: 1;

      display: grid;
      place-items: center;

      background: var(--paper);

      border-radius: 50%;

      box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 35px 90px rgba(0,0,0,.22);
    }

    .error-visual-core::before {
      content: "";

      position: absolute;
      inset: 13%;

      border:
        1px solid rgba(7,27,51,.10);

      border-radius: 50%;
    }

    .error-visual-core img {
      position: relative;
      z-index: 2;

      width: 62%;
      height: 62%;

      object-fit: contain;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .error-footer {
      position: relative;
      z-index: 5;

      width:
        min(
          calc(100% - (var(--gutter) * 2)),
          1480px
        );

      margin-inline: auto;

      min-height: 90px;

      display: grid;

      grid-template-columns:
        1fr
        auto
        1fr;

      align-items: center;

      gap: 30px;

      border-top:
        1px solid var(--line);
    }

    .error-footer-left,
    .error-footer-right,
    .error-footer-center {
      font-family: "DM Mono", monospace;

      font-size: .62rem;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .error-footer-left {
      color: rgba(255,255,255,.45);
    }

    .error-footer-center {
      justify-self: center;

      color: rgba(255,255,255,.58);

      white-space: nowrap;
    }

    .error-footer-right {
      justify-self: end;

      color: rgba(255,255,255,.34);

      white-space: nowrap;
    }


    /* =====================================================
       ANIMATION
       ===================================================== */

    .error-content {
      animation:
        error-enter 1100ms var(--ease-out) both;
    }

    .error-visual {
      animation:
        visual-enter 1400ms var(--ease-out) 150ms both;
    }

    @keyframes error-enter {
      from {
        opacity: 0;
        transform:
          translateY(35px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }
    }

    @keyframes visual-enter {
      from {
        opacity: 0;
        transform:
          scale(.88)
          rotate(-8deg);
      }

      to {
        opacity: 1;
        transform:
          scale(1)
          rotate(0);
      }
    }

    @keyframes orbit {
      to {
        transform:
          rotate(360deg);
      }
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 760px) {

      :root {
        --gutter: 20px;
      }

      body {
        overflow: auto;
      }

      .error-page {
        min-height: 100svh;

        grid-template-rows:
          auto 1fr auto;
      }

      .error-header {
        min-height: 72px;
      }

      .error-logo img {
        width: 50px;
        height: 50px;
      }

      .error-header-label {
        font-size: .58rem;
      }

      .error-main {
        padding-block: 45px;
      }

      .error-content {
        grid-template-columns: 1fr;

        gap: 55px;

        text-align: center;
      }

      .error-kicker {
        margin-bottom: 20px;
      }

      .error-title {
        font-size:
          clamp(5.2rem, 26vw, 8rem);
      }

      .error-copy {
        margin-inline: auto;

        margin-top: 32px;

        font-size: 1rem;
      }

      .error-action {
        margin-top: 30px;
      }

      .error-visual {
        width: min(72vw, 310px);
      }

      .error-footer {
        min-height: 110px;

        grid-template-columns:
          1fr
          auto;

        grid-template-areas:
          "left right"
          "center center";

        row-gap: 10px;
      }

      .error-footer-left {
        grid-area: left;
      }

      .error-footer-right {
        grid-area: right;
      }

      .error-footer-center {
        grid-area: center;

        justify-self: start;

        white-space: normal;

        line-height: 1.4;
      }
    }


    /* =====================================================
       SMALL MOBILE
       ===================================================== */

    @media (max-width: 430px) {

      .error-main {
        padding-block: 35px;
      }

      .error-title {
        font-size: 5rem;
      }

      .error-visual {
        width: 245px;
      }

      .error-footer {
        font-size: .55rem;
      }
    }


    /* =====================================================
       LANDSCAPE
       ===================================================== */

    @media (max-height: 650px) and (orientation: landscape) {

      .error-main {
        padding-block: 25px;
      }

      .error-content {
        grid-template-columns:
          minmax(0, 1fr)
          220px;

        gap: 40px;
      }

      .error-title {
        font-size:
          clamp(4rem, 11vw, 7rem);
      }

      .error-copy {
        margin-top: 20px;
      }

      .error-action {
        margin-top: 20px;
      }

      .error-visual {
        width: 220px;
      }
    }


    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }


    /* =====================================================
       HIGH CONTRAST
       ===================================================== */

    @media (prefers-contrast: more) {

      .error-copy {
        color: var(--white);
      }

      .error-header,
      .error-footer {
        border-color:
          rgba(255,255,255,.35);
      }
    }

  </style>
</head>


<body>

  <main class="error-page">

    <!-- ATMOSPHERE -->

    <div
      class="error-atmosphere"
      aria-hidden="true"
    >
      <div class="error-grid"></div>
      <div class="error-glow"></div>
      <div class="error-orbit"></div>
      <div class="error-line"></div>
    </div>


    <!-- HEADER -->

    <header class="error-header">

      <a
        class="error-logo"
        href="/"
        aria-label="Torna alla home di Cesare Paratore"
      >
        <img
          src="/assets/images/cp-mark.png"
          alt="Cesare Paratore"
          width="60"
          height="60"
        >
      </a>

      <span class="error-header-label">
        MOVIMENTO / CON DIREZIONE.
      </span>

    </header>


    <!-- MAIN -->

    <section class="error-main">

      <div class="error-content">

        <div class="error-copy-block">

          <div class="error-kicker">
            404 — TRAIETTORIA NON TROVATA
          </div>

          <h1 class="error-title">
            <span>QUESTA</span>
            <span>STRADA.</span>
          </h1>

          <p class="error-copy">
            La pagina che stai cercando non è
            disponibile. Ma un percorso non finisce
            quando una strada non porta dove pensavi.
            Si cambia direzione.
          </p>

          <a
            class="error-action"
            href="/"
          >
            Riparti dall'inizio
          </a>

        </div>


        <!-- VISUAL -->

        <div
          class="error-visual"
          aria-hidden="true"
        >

          <div class="error-visual-ring">
            <div class="error-visual-ring-inner"></div>
          </div>

          <div class="error-visual-core">

            <img
              src="/assets/images/cp-mark.png"
              alt=""
              width="180"
              height="180"
            >

          </div>

        </div>

      </div>

    </section>


    <!-- FOOTER -->

    <footer class="error-footer">

      <span class="error-footer-left">
        CESARE PARATORE
      </span>

      <span class="error-footer-center">
        MOVIMENTO / CON DIREZIONE.
      </span>

      <span class="error-footer-right">
        © 2026 CESARE PARATORE
      </span>

    </footer>

  </main>


  <script>
    (() => {
      const root = document.documentElement;

      if (
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches
      ) {
        return;
      }

      const visual =
        document.querySelector(".error-visual");

      if (!visual) return;

      if (
        window.matchMedia(
          "(pointer: coarse)"
        ).matches
      ) {
        return;
      }

      let raf = null;

      window.addEventListener(
        "pointermove",
        (event) => {

          if (raf) {
            cancelAnimationFrame(raf);
          }

          raf = requestAnimationFrame(() => {

            const x =
              (event.clientX -
                window.innerWidth / 2) *
              0.012;

            const y =
              (event.clientY -
                window.innerHeight / 2) *
              0.012;

            visual.style.transform =
              `translate3d(${x}px, ${y}px, 0)`;

          });

        },
        { passive: true }
      );

      window.addEventListener(
        "pointerleave",
        () => {
          visual.style.transform =
            "translate3d(0,0,0)";
        }
      );

    })();
  </script>

</body>
</html>
