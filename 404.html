<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <meta
    name="description"
    content="Pagina non trovata."
  >

  <title>404 — Cesare Paratore</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body class="page-404">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="site-header">
    <a
      href="index.html"
      class="site-header__logo"
      aria-label="Cesare Paratore — torna all'inizio"
    >
      <img
        src="assets/images/cp-mark.svg"
        alt="CP"
      >
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Apri il menu"
      aria-expanded="false"
      aria-controls="global-menu"
    >
      <span>MENU</span>
    </button>
  </header>


  <!-- =====================================================
       GLOBAL MENU
       ===================================================== -->

  <aside
    id="global-menu"
    class="global-menu"
    aria-hidden="true"
  >

    <nav class="global-menu__nav" aria-label="Navigazione principale">

      <a href="index.html#chi-sono">
        Chi sono
      </a>

      <a href="index.html#sport">
        Sport
      </a>

      <a href="index.html#scienze-motorie">
        Scienze motorie
      </a>

      <a href="index.html#educazione">
        Educazione
      </a>

      <a href="index.html#management">
        Management
      </a>

      <a href="index.html#digitale">
        Digitale
      </a>

      <a href="index.html#territorio">
        Territorio
      </a>

      <a href="index.html#contatti">
        Contatti
      </a>

    </nav>

  </aside>


  <!-- =====================================================
       404
       ===================================================== -->

  <main class="page-404__main">

    <section
      class="page-404__content"
      aria-labelledby="error-title"
    >

      <p class="page-404__code">
        404
      </p>

      <div class="page-404__copy">

        <h1 id="error-title">
          Questa pagina non è dove pensavi di trovarla.
        </h1>

        <p>
          Ma forse è un buon momento per tornare a guardare.
        </p>

        <a
          href="index.html"
          class="page-404__link"
        >
          Torna all'inizio
        </a>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="site-footer">

    <a
      href="index.html"
      class="site-footer__logo"
      aria-label="Cesare Paratore — torna all'inizio"
    >
      <img
        src="assets/images/cp-mark.svg"
        alt="CP"
      >
    </a>

    <p class="site-footer__name">
      CESARE PARATORE
    </p>

  </footer>


  <!-- =====================================================
       SCRIPT
       ===================================================== -->

  <script src="script.js"></script>

</body>
</html>
