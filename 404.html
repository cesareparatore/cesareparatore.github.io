<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0B0B0A"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <meta
    name="description"
    content="Pagina non trovata — Cesare Paratore."
  >

  <title>404 — Cesare Paratore</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="page-404">

  <!-- =========================================================
       HEADER
  ========================================================== -->

  <header class="site-header">

    <a
      class="site-header__logo"
      href="index.html#guarda"
      aria-label="Cesare Paratore — torna all'inizio"
    >
      <img
        src="assets/images/cp-mark.svg"
        alt="CP"
      >
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="global-menu"
    >
      MENU
    </button>

  </header>


  <!-- =========================================================
       MENU
  ========================================================== -->

  <aside
    class="global-menu"
    id="global-menu"
    aria-hidden="true"
  >

    <div class="global-menu__inner">

      <nav
        class="global-menu__nav"
        aria-label="Navigazione principale"
      >

        <a href="index.html#movimento">
          Sport
        </a>

        <a href="index.html#capire">
          Scienze motorie
        </a>

        <a href="index.html#trasmettere">
          Educazione
        </a>

        <a href="index.html#costruire">
          Management
        </a>

        <a href="index.html#ritorna">
          Digitale
        </a>

        <a href="index.html#qui">
          Territorio
        </a>

        <a href="index.html#scrivimi">
          Contatti
        </a>

      </nav>

    </div>

  </aside>


  <!-- =========================================================
       404
  ========================================================== -->

  <main class="page-404__main">

    <section
      class="page-404__section"
      aria-labelledby="error-title"
    >

      <div class="page-404__inner">

        <p
          class="page-404__number"
          aria-hidden="true"
        >
          404
        </p>

        <div class="page-404__content">

          <h1
            class="page-404__title"
            id="error-title"
          >
            Questa pagina non è dove pensavi di trovarla.
          </h1>

          <p class="page-404__text">
            Ma forse è un buon momento per tornare a guardare.
          </p>

          <a
            class="page-404__link"
            href="index.html#guarda"
          >
            Torna all'inizio
          </a>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================================================
       FOOTER
  ========================================================== -->

  <footer class="site-footer">

    <a
      class="site-footer__logo"
      href="index.html#guarda"
      aria-label="Torna all'inizio"
    >
      <img
        src="assets/images/cp-mark.svg"
        alt="CP"
      >
    </a>

    <div class="site-footer__name">
      CESARE PARATORE
    </div>

  </footer>


  <!-- =========================================================
       MENU
  ========================================================== -->

  <script>
    (() => {
      "use strict";

      const body = document.body;
      const menuToggle =
        document.querySelector(".menu-toggle");
      const globalMenu =
        document.getElementById("global-menu");

      if (!menuToggle || !globalMenu) {
        return;
      }

      const closeMenu = () => {

        menuToggle.setAttribute(
          "aria-expanded",
          "false"
        );

        globalMenu.setAttribute(
          "aria-hidden",
          "true"
        );

        globalMenu.classList.remove(
          "is-open"
        );

        body.classList.remove(
          "is-menu-open"
        );
      };

      const openMenu = () => {

        menuToggle.setAttribute(
          "aria-expanded",
          "true"
        );

        globalMenu.setAttribute(
          "aria-hidden",
          "false"
        );

        globalMenu.classList.add(
          "is-open"
        );

        body.classList.add(
          "is-menu-open"
        );
      };

      menuToggle.addEventListener(
        "click",
        () => {

          const isOpen =
            menuToggle.getAttribute(
              "aria-expanded"
            ) === "true";

          if (isOpen) {
            closeMenu();
          } else {
            openMenu();
          }

        }
      );

      globalMenu
        .querySelectorAll("a")
        .forEach((link) => {

          link.addEventListener(
            "click",
            closeMenu
          );

        });

      document.addEventListener(
        "keydown",
        (event) => {

          if (event.key === "Escape") {
            closeMenu();
          }

        }
      );

    })();
  </script>

</body>
</html>
