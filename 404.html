<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="robots"
    content="noindex, follow"
  >

  <title>Pagina non trovata — Cesare Paratore</title>

  <style>
    :root {
      --light: #F1EFE8;
      --dark: #0B0B0A;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100%;
    }

    body {
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      background: var(--light);
      color: var(--dark);

      font-family:
        "Neue Montreal",
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    :focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
    }

    .site-header {
      position: relative;

      width: 100%;

      padding: 28px 5vw;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo {
      display: block;
      width: clamp(42px, 4vw, 62px);
      height: auto;
    }

    .menu-toggle {
      padding: 0;

      border: 0;
      background: none;

      color: var(--dark);

      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      cursor: pointer;
    }

    .menu-toggle:hover {
      opacity: 0.5;
    }

    .menu {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--light);
      color: var(--dark);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 400ms ease,
        visibility 400ms ease;
    }

    .menu.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .menu-close {
      position: absolute;
      top: 28px;
      right: 5vw;

      padding: 0;

      border: 0;
      background: none;

      color: var(--dark);

      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      cursor: pointer;
    }

    .menu-list {
      margin: 0;
      padding: 0;

      display: flex;
      flex-direction: column;
      align-items: center;

      list-style: none;
    }

    .menu-list a {
      display: block;

      font-size: clamp(2rem, 6vw, 6rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-align: center;

      transition: opacity 180ms ease;
    }

    .menu-list a:hover {
      opacity: 0.4;
    }

    .error {
      flex: 1;

      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 10vh 5vw;
    }

    .error-inner {
      width: min(100%, 900px);

      text-align: center;
    }

    .error-code {
      margin: 0 0 2rem;

      font-size: clamp(7rem, 20vw, 18rem);
      font-weight: 500;
      line-height: 0.8;
      letter-spacing: -0.07em;
    }

    .error-title {
      margin: 0 auto 1.5rem;

      max-width: 800px;

      font-size: clamp(2rem, 5vw, 5rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .error-copy {
      max-width: 580px;
      margin: 0 auto;

      font-size: clamp(1.15rem, 1.35vw, 1.5rem);
      line-height: 1.5;
    }

    .error-link {
      display: inline-block;

      margin-top: 2.5rem;

      padding-bottom: 0.35rem;

      border-bottom: 1px solid currentColor;

      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      transition: opacity 180ms ease;
    }

    .error-link:hover {
      opacity: 0.5;
    }

    .site-footer {
      width: 100%;

      padding: 28px 5vw;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: var(--light);
      color: var(--dark);
    }

    .footer-logo {
      display: block;
      width: clamp(42px, 4vw, 62px);
      height: auto;
    }

    .footer-name {
      margin: 0;

      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 767px) {
      .site-header {
        padding: 20px;
      }

      .menu-close {
        top: 20px;
        right: 20px;
      }

      .error {
        padding: 8vh 20px;
      }

      .error-code {
        margin-bottom: 1.5rem;
        font-size: clamp(6rem, 30vw, 10rem);
      }

      .error-title {
        font-size: clamp(2rem, 9vw, 3.5rem);
      }

      .error-copy {
        font-size: 1.15rem;
      }

      .site-footer {
        padding: 24px 20px;
      }

      .footer-logo {
        width: 44px;
      }

      .footer-name {
        font-size: 0.72rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a
      href="/"
      aria-label="Cesare Paratore — Home"
    >
      <img
        class="site-logo"
        src="/assets/images/cp-mark.svg"
        alt="CP"
      >
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-menu"
    >
      MENU
    </button>
  </header>

  <div
    class="menu"
    id="site-menu"
    aria-hidden="true"
  >
    <button
      class="menu-close"
      type="button"
    >
      CHIUDI
    </button>

    <nav aria-label="Navigazione principale">
      <ul class="menu-list">
        <li><a href="/chi-sono/">CHI SONO</a></li>
        <li><a href="/sport/">SPORT</a></li>
        <li><a href="/scienze-motorie/">SCIENZE MOTORIE</a></li>
        <li><a href="/educazione/">EDUCAZIONE</a></li>
        <li><a href="/management/">MANAGEMENT</a></li>
        <li><a href="/digitale/">DIGITALE</a></li>
        <li><a href="/territorio/">TERRITORIO</a></li>
        <li><a href="/contatti/">CONTATTI</a></li>
      </ul>
    </nav>
  </div>

  <main class="error">
    <div class="error-inner">

      <p class="error-code">404</p>

      <h1 class="error-title">
        Questa pagina non è dove pensavi di trovarla.
      </h1>

      <p class="error-copy">
        Ma forse è un buon momento per tornare a guardare.
      </p>

      <a
        class="error-link"
        href="/"
      >
        Torna all'inizio →
      </a>

    </div>
  </main>

  <footer class="site-footer">
    <a
      href="/"
      aria-label="Cesare Paratore — Home"
    >
      <img
        class="footer-logo"
        src="/assets/images/cp-mark.svg"
        alt="CP"
      >
    </a>

    <p class="footer-name">
      CESARE PARATORE
    </p>
  </footer>

  <script>
    (() => {
      "use strict";

      const menu = document.querySelector(".menu");
      const menuToggle = document.querySelector(".menu-toggle");
      const menuClose = document.querySelector(".menu-close");

      function openMenu() {
        menu.classList.add("is-open");
        menu.setAttribute("aria-hidden", "false");
        menuToggle.setAttribute("aria-expanded", "true");
        document.body.style.overflow = "hidden";
      }

      function closeMenu() {
        menu.classList.remove("is-open");
        menu.setAttribute("aria-hidden", "true");
        menuToggle.setAttribute("aria-expanded", "false");
        document.body.style.overflow = "";
      }

      menuToggle.addEventListener("click", () => {
        if (menu.classList.contains("is-open")) {
          closeMenu();
        } else {
          openMenu();
        }
      });

      menuClose.addEventListener("click", closeMenu);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeMenu();
        }
      });

      menu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", closeMenu);
      });
    })();
  </script>

</body>
</html>
