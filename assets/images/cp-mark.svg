<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="cp-title cp-description"
>
  <title id="cp-title">CP</title>

  <desc id="cp-description">
    Monogramma CP nero inchiostro — optical correction, small-size tested
  </desc>

  <g
    id="cp-mark"
    fill="#11110F"
    fill-rule="evenodd"
    clip-rule="evenodd"
  >

    <!-- =========================================================
         C
         Final optical correction

         • curva esterna più regolare
         • controforma interna preservata
         • terminale superiore controllato
         • terminale inferiore compensato otticamente
         • silhouette stabile alle piccole dimensioni
       ========================================================= -->

    <path
      id="letter-c"
      d="
        M263 163
        L245 194
        H198

        C174 194 155 200 142 213
        C129 225 122 242 122 260

        C122 279 129 296 143 309
        C157 322 176 327 199 327

        H226
        L210 358

        H194

        C161 358 133 349 113 330
        C95 312 86 288 86 262

        C86 234 96 209 115 190
        C135 172 162 163 194 163

        Z
      "
    />

    <!-- =========================================================
         P
         Final optical correction

         • +4 unit optical separation from C
         • bowl leggermente più aperto
         • transizione bowl/diagonale più pulita
         • gamba mantenuta sufficientemente larga per 16–32 px
         • curva esterna più stabile dopo rasterizzazione
       ========================================================= -->

    <path
      id="letter-p"
      d="
        M261 194

        L243 231
        H397

        C409 231 418 233 425 238
        C431 242 434 248 434 255

        C434 262 431 268 425 272
        C418 276 409 278 397 278

        H271

        L215 389
        H258

        L300 313
        H398

        C423 313 443 307 457 296
        C471 285 478 271 478 254

        C478 236 471 221 457 210
        C443 199 423 194 398 194

        Z
      "
    />

  </g>
</svg>
