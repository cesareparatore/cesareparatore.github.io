<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

  <meta

  >

  <meta

  >

  >

  <meta name="theme-color" content="#050505">

  <!-- Open Graph -->
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Cesare Paratore">
  <meta property="og:locale" content="it_IT">

  <meta

    content="Cesare Paratore — Sito personale"
  >

  <meta
    property="og:description"
    content="Cesare Paratore — sito personale. Partinico, Sicilia, Italia."
  >

  <meta

  >

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary">

  >

  >

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "@id": "https://cesareparatore.github.io/#profile",
    "url": "https://cesareparatore.github.io/",
    "name": "Cesare Paratore — Sito personale",
    "description": "Cesare Paratore — sito personale. Partinico, Sicilia, Italia.",
    "inLanguage": "it-IT",
    "mainEntity": {
      "@type": "Person",
      "@id": "https://cesareparatore.github.io/#cesare-paratore",
      "name": "Cesare Paratore",
      "url": "https://cesareparatore.github.io/",
      "homeLocation": {
        "@type": "Place",
        "name": "Partinico, Sicilia, Italia"
      }
    }
  }
  </script>

  <style>
    :root {
      --bg: #050505;
      --fg: #f4f3ef;
      --secondary: #aaa9a3;
      --muted: #77766f;
      --line: #292927;
      --line-soft: #1b1b1a;

      --sans:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      --mono:
        "SFMono-Regular",
        "Cascadia Mono",
        "Roboto Mono",
        Consolas,
        "Liberation Mono",
        monospace;

      --gutter:
        clamp(1rem, 3vw, 3.75rem);

      --top:
        clamp(1.15rem, 2.2vw, 2.75rem);

      --display:
        clamp(
          3.4rem,
          calc(6.5vw + 1rem),
          10.5rem
        );

      --body:
        clamp(
          1rem,
          calc(.18vw + .98rem),
          1.15rem
        );

      --ease:
        cubic-bezier(.16, 1, .3, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 280px;
      min-height: 100%;

      background: var(--bg);
      color: var(--fg);

      color-scheme: dark;

      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;

      scroll-behavior: smooth;
    }

    body {
      min-width: 280px;
      min-height: 100svh;

      margin: 0;

      overflow-x: clip;

      background: var(--bg);
      color: var(--fg);

      font-family: var(--sans);
      font-synthesis: none;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      text-rendering: optimizeLegibility;
    }

    ::selection {
      color: var(--bg);
      background: var(--fg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 7px;
    }

    .page {
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      padding:
        max(var(--top), env(safe-area-inset-top))
        max(var(--gutter), env(safe-area-inset-right))
        max(var(--top), env(safe-area-inset-bottom))
        max(var(--gutter), env(safe-area-inset-left));
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      animation:
        header-in .8s var(--ease) both;
    }

    .brand {
      display: inline-block;

      color: var(--fg);

      font-size:
        clamp(.76rem, .72vw, .86rem);

      font-weight: 600;

      line-height: 1;

      letter-spacing: -.035em;
      text-transform: uppercase;
    }

    /* =========================
       MAIN
       ========================= */

    main {
      flex: 1;

      display: flex;
      align-items: center;
    }

    .content {
      width: min(100%, 1550px);
      margin-inline: auto;

      padding-block:
        clamp(4rem, 9vh, 8.5rem);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: .8rem;

      margin-bottom:
        clamp(2rem, 3vw, 3.3rem);

      color: var(--secondary);

      font-family: var(--mono);

      font-size:
        clamp(.63rem, .62vw, .71rem);

      font-weight: 450;

      line-height: 1.4;

      letter-spacing: .055em;
      text-transform: uppercase;

      animation:
        fade-up .9s .05s var(--ease) both;
    }

    .eyebrow-rule {
      width: 2rem;
      height: 1px;

      flex: 0 0 auto;

      background: var(--line);
    }

    h1 {
      width: min(100%, 1500px);

      margin: 0;

      color: var(--fg);

      font-family: var(--sans);

      font-size: var(--display);
      font-weight: 430;

      line-height: .94;

      letter-spacing: -.075em;

      font-kerning: normal;
      text-wrap: balance;
    }

    .hero-line {
      display: block;

      overflow: visible;

      padding:
        0 .065em .1em;

      margin-bottom: -.1em;
    }

    .hero-line-inner {
      display: inline-block;

      transform:
        translate3d(0, 108%, 0);

      animation:
        reveal 1.1s var(--ease) forwards;
    }

    .hero-line:nth-child(2)
      .hero-line-inner {
      animation-delay: .1s;
    }

    .location {
      margin-top:
        clamp(3.2rem, 6vh, 6rem);

      animation:
        fade-up .95s .34s var(--ease) both;
    }

    .location-grid {
      display: grid;

      grid-template-columns:
        clamp(35px, 5vw, 72px)
        minmax(0, 500px);

      gap:
        clamp(1.1rem, 3vw, 3rem);
    }

    .location-rule {
      width: 100%;
      height: 1px;

      margin-top: .7rem;

      background: var(--line);
    }

    .location-copy {
      margin: 0;

      color: var(--secondary);

      font-size: var(--body);
      font-weight: 400;

      line-height: 1.55;

      letter-spacing: -.012em;
    }

    .location-copy strong {
      color: var(--fg);
      font-weight: 530;
    }

    .location-place {
      display: block;

      margin-top: .75rem;

      color: var(--muted);

      font-family: var(--mono);

      font-size: .66rem;
      font-weight: 450;

      line-height: 1.5;

      letter-spacing: .065em;

      text-transform: uppercase;
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      display: grid;

      grid-template-columns: 1fr 1fr;

      align-items: center;

      min-height: 2.5rem;

      padding-top: 1rem;

      border-top:
        1px solid var(--line-soft);

      color: var(--secondary);

      font-family: var(--mono);

      font-size: .6rem;
      font-weight: 450;

      line-height: 1.45;

      letter-spacing: .05em;

      text-transform: uppercase;

      animation:
        fade-up .9s .45s var(--ease) both;
    }

    .footer-left {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .footer-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;

      min-width: 0;
    }

    .privacy-link {
      display: inline-block;

      color: var(--secondary);

      transition:
        color .35s ease;
    }

    .privacy-link:hover {
      color: var(--fg);
    }

    .signature-link {
      display: inline-flex;
      align-items: center;

      min-height: 1.5rem;

      color: var(--secondary);

      white-space: nowrap;

      transition:
        color .35s ease;
    }

    .signature-name {
      transition:
        color .35s ease;
    }

    .signature-line {
      position: relative;

      display: inline-block;

      width: 0;
      height: 1px;

      margin-left: .2rem;

      background: var(--fg);

      opacity: 0;

      transition:
        width .55s var(--ease),
        opacity .25s ease,
        margin-left .55s var(--ease);
    }

    .signature-arrow {
      display: inline-block;

      margin-left: .08rem;

      color: var(--fg);

      font-family: var(--sans);

      font-size: .78rem;
      font-weight: 400;

      line-height: 1;

      opacity: 0;

      transform:
        translate3d(-5px, 4px, 0);

      transition:
        opacity .25s ease,
        transform .55s var(--ease);
    }

    .signature-link:hover {
      color: var(--fg);
    }

    .signature-link:hover
      .signature-line,
    .signature-link:focus-visible
      .signature-line {
      width: clamp(2rem, 4vw, 4.5rem);

      margin-left: .45rem;

      opacity: 1;
    }

    .signature-link:hover
      .signature-arrow,
    .signature-link:focus-visible
      .signature-arrow {
      opacity: 1;

      transform:
        translate3d(0, 0, 0);
    }

    /* =========================
       ANIMATIONS
       ========================= */

    @keyframes header-in {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes reveal {
      from {
        transform:
          translate3d(0, 108%, 0);
      }

      to {
        transform:
          translate3d(0, 0, 0);
      }
    }

    /* =========================
       LARGE SCREENS
       ========================= */

    @media (min-width: 1600px) {
      .content {
        padding-block: 8vh;
      }
    }

    /* =========================
       TABLET
       ========================= */

    @media (max-width: 900px) {
      :root {
        --display:
          clamp(
            4rem,
            9vw,
            7.5rem
          );
      }

      .content {
        padding-block: 4rem;
      }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 640px) {
      :root {
        --gutter: 1.15rem;
        --top: 1.15rem;

        --display:
          clamp(
            3.35rem,
            calc(10.2vw + 1.15rem),
            5.4rem
          );
      }

      .brand {
        font-size: .72rem;
      }

      main {
        align-items: flex-start;
      }

      .content {
        padding-block:
          clamp(4.75rem, 12vh, 7rem)
          3.5rem;
      }

      .eyebrow {
        gap: .62rem;

        margin-bottom: 2rem;

        font-size: .6rem;
      }

      .eyebrow-rule {
        width: 1.35rem;
      }

      h1 {
        line-height: .97;
        letter-spacing: -.068em;
      }

      .hero-line {
        padding-bottom: .12em;
        margin-bottom: -.12em;
      }

      .location {
        margin-top: 3.7rem;
      }

      .location-grid {
        grid-template-columns:
          28px
          minmax(0, 1fr);

        gap: 1rem;
      }

      .location-rule {
        margin-top: .62rem;
      }

      .location-copy {
        font-size: 1rem;
        line-height: 1.56;
      }

      .location-place {
        margin-top: .72rem;
        font-size: .6rem;
      }

      .footer {
        min-height: 2.25rem;

        font-size: .57rem;
      }

      .signature-line {
        width: 0;
      }

      .signature-link:hover
        .signature-line,
      .signature-link:focus-visible
        .signature-line {
        width: 2.2rem;
      }
    }

    /* =========================
       SMALL MOBILE
       ========================= */

    @media (max-width: 390px) {
      :root {
        --gutter: 1rem;

        --display:
          clamp(
            3.15rem,
            calc(9.8vw + 1.1rem),
            4.55rem
          );
      }

      .eyebrow {
        font-size: .57rem;
      }

      .location-copy {
        font-size: .97rem;
      }
    }

    /* =========================
       SHORT MOBILE VIEWPORTS
       ========================= */

    @media
      (max-width: 640px)
      and (max-height: 700px) {

      .content {
        padding-top: 4.25rem;
      }

      .location {
        margin-top: 3rem;
      }
    }

    /* =========================
       LANDSCAPE MOBILE
       ========================= */

    @media
      (max-width: 900px)
      and (orientation: landscape)
      and (max-height: 600px) {

      .content {
        padding-block: 3rem;
      }

      :root {
        --display:
          clamp(
            3.4rem,
            8vw,
            6.4rem
          );
      }

      .location {
        margin-top: 2.7rem;
      }
    }

    /* =========================
       REDUCED MOTION
       ========================= */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .hero-line-inner {
        transform: none;
      }

      .header,
      .eyebrow,
      .location,
      .footer {
        opacity: 1;
        transform: none;
      }

      .signature-line,
      .signature-arrow {
        transition: none;
      }
    }

    /* =========================
       HIGH CONTRAST
       ========================= */

    @media (prefers-contrast: more) {
      :root {
        --secondary: #d1d0ca;
        --muted: #aaa9a3;
        --line: #444440;
        --line-soft: #30302d;
      }
    }

    /* =========================
       PRINT
       ========================= */

    @media print {
      html,
      body {
        min-width: 0;
        min-height: auto;

        background: #fff;
        color: #000;
      }

      body {
        -webkit-font-smoothing: auto;
        text-rendering: auto;
      }

      .page {
        min-height: auto;

        padding: 1.5rem;
      }

      .header,
      .eyebrow,
      .location,
      .footer {
        animation: none;
      }

      .hero-line-inner {
        transform: none;
        animation: none;
      }

      .privacy-link,
      .signature-link {
        color: #000;
      }

      .signature-line,
      .signature-arrow {
        opacity: 1;
        transform: none;
      }

      .footer {
        border-top-color: #ccc;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="header">
      <a
        class="brand"
        href="/"
        aria-label="Cesare Paratore — pagina principale"
      >
        CESARE PARATORE
      </a>
    </header>


    <main>

      <section
        class="content"
        aria-labelledby="main-title"
      >

        <div class="eyebrow">
          <span>Sito personale</span>

          <span
            class="eyebrow-rule"
            aria-hidden="true"
          ></span>

          <span>2026</span>
        </div>


        <h1 id="main-title">

          <span class="hero-line">
            <span class="hero-line-inner">
              Cesare
            </span>
          </span>

          <span class="hero-line">
            <span class="hero-line-inner">
              Paratore.
            </span>
          </span>

        </h1>


        <div
          class="location"
          aria-label="Identità e località"
        >

          <div class="location-grid">

            <div
              class="location-rule"
              aria-hidden="true"
            ></div>

            <div>

              <p class="location-copy">
                <strong>Uno spazio personale.</strong>
                Un'identità digitale.
              </p>

              <span class="location-place">
                Partinico / Sicilia / Italia
              </span>

            </div>

          </div>

        </div>

      </section>

    </main>


    <footer class="footer">

      <div class="footer-left">
        <a
          class="privacy-link"
          href="/privacy/"
          aria-label="Leggi l'informativa sulla privacy"
        >
          Privacy
        </a>
      </div>


      <div class="footer-right">

        <a
          class="signature-link"
          href="/"
          aria-label="Vai alla pagina personale di Cesare Paratore"
          aria-current="page"
        >

          <span class="signature-name">
            Cesare Paratore
          </span>

          <span
            class="signature-line"
            aria-hidden="true"
          ></span>

          <span
            class="signature-arrow"
            aria-hidden="true"
          >
            ↗
          </span>

        </a>

      </div>

    </footer>

  </div>

</body>
</html>
