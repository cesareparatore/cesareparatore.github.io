  <style>
    :root {
      --bg: #050505;
      --fg: #f4f3ef;
      --secondary: #aaa9a3;
      --muted: #77766f;
      --line: #292927;
      --line-soft: #1b1b1a;

      --sans:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      --mono:
        "SFMono-Regular",
        "Cascadia Mono",
        "Roboto Mono",
        Consolas,
        "Liberation Mono",
        monospace;

      --gutter:
        clamp(1.1rem, 3vw, 3.75rem);

      --top:
        clamp(1.15rem, 2.2vw, 2.75rem);

      --display:
        clamp(
          3.4rem,
          calc(6.5vw + 1rem),
          10.5rem
        );

      --body:
        clamp(
          1rem,
          calc(.18vw + .98rem),
          1.15rem
        );

      --ease:
        cubic-bezier(.16, 1, .3, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 280px;
      min-height: 100%;
      background: var(--bg);
      color-scheme: dark;
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-width: 280px;
      min-height: 100svh;
      margin: 0;

      overflow-x: clip;

      background: var(--bg);
      color: var(--fg);

      font-family: var(--sans);
      font-synthesis: none;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      text-rendering: optimizeLegibility;
    }

    ::selection {
      color: var(--bg);
      background: var(--fg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      padding:
        max(var(--top), env(safe-area-inset-top))
        max(var(--gutter), env(safe-area-inset-right))
        max(var(--top), env(safe-area-inset-bottom))
        max(var(--gutter), env(safe-area-inset-left));
    }

    .header {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      animation:
        header-in .8s var(--ease) both;
    }

    .brand {
      display: inline-block;

      color: var(--fg);

      font-size:
        clamp(.76rem, .72vw, .86rem);

      font-weight: 600;

      line-height: 1;

      letter-spacing: -.035em;
      text-transform: uppercase;
    }

    .brand:focus-visible,
    .community-link:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 7px;
    }

    .header-right {
      display: flex;
      align-items: flex-start;
      gap: clamp(1.25rem, 3vw, 3rem);
    }

    .community-link {
      display: inline-block;

      color: var(--secondary);

      font-family: var(--mono);

      font-size:
        clamp(.59rem, .56vw, .67rem);

      font-weight: 450;

      line-height: 1.4;

      letter-spacing: .065em;
      text-transform: uppercase;

      transition:
        color .35s ease,
        opacity .35s ease;
    }

    .community-link:hover {
      color: var(--fg);
    }

    main {
      flex: 1;

      display: flex;
      align-items: center;
    }

    .content {
      width: min(100%, 1550px);
      margin-inline: auto;

      padding-block:
        clamp(4rem, 9vh, 8.5rem);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: .8rem;

      margin-bottom:
        clamp(2rem, 3vw, 3.3rem);

      color: var(--secondary);

      font-family: var(--mono);

      font-size:
        clamp(.63rem, .62vw, .71rem);

      font-weight: 450;

      line-height: 1.4;

      letter-spacing: .055em;
      text-transform: uppercase;

      animation:
        fade-up .9s .05s var(--ease) both;
    }

    .eyebrow-rule {
      width: 2rem;
      height: 1px;

      background: var(--line);
    }

    h1 {
      width: min(100%, 1500px);

      margin: 0;

      color: var(--fg);

      font-family: var(--sans);

      font-size: var(--display);
      font-weight: 430;

      line-height: .94;

      letter-spacing: -.075em;

      font-kerning: normal;
      text-wrap: balance;
    }

    .hero-line {
      display: block;

      overflow: visible;

      padding:
        0 .065em .1em;

      margin-bottom: -.1em;
    }

    .hero-line-inner {
      display: inline-block;

      transform:
        translate3d(0, 108%, 0);

      will-change: transform;

      animation:
        reveal 1.1s var(--ease) forwards;
    }

    .hero-line:nth-child(2)
      .hero-line-inner {
      animation-delay: .1s;
    }

    .hero-line:nth-child(3)
      .hero-line-inner {
      animation-delay: .2s;
    }

    .hero-line:nth-child(4)
      .hero-line-inner {
      animation-delay: .3s;
    }

    .location {
      margin-top:
        clamp(3.2rem, 6vh, 6rem);

      animation:
        fade-up .95s .34s var(--ease) both;
    }

    .location-grid {
      display: grid;

      grid-template-columns:
        clamp(35px, 5vw, 72px)
        minmax(0, 500px);

      gap:
        clamp(1.1rem, 3vw, 3rem);
    }

    .location-rule {
      width: 100%;
      height: 1px;

      margin-top: .7rem;

      background: var(--line);
    }

    .location-copy {
      margin: 0;

      color: var(--secondary);

      font-size: var(--body);
      font-weight: 400;

      line-height: 1.55;

      letter-spacing: -.012em;
    }

    .location-copy strong {
      color: var(--fg);
      font-weight: 530;
    }

    .location-place {
      display: block;

      margin-top: .75rem;

      color: var(--muted);

      font-family: var(--mono);

      font-size: .66rem;
      font-weight: 450;

      line-height: 1.5;

      letter-spacing: .065em;

      text-transform: uppercase;
    }

    .community {
      margin-top:
        clamp(3.5rem, 7vh, 6.5rem);

      animation:
        fade-up .95s .43s var(--ease) both;
    }

    .community-link-block {
      display: grid;

      grid-template-columns:
        clamp(35px, 5vw, 72px)
        minmax(0, 500px);

      gap:
        clamp(1.1rem, 3vw, 3rem);

      width: fit-content;
      max-width: 100%;
    }

    .community-rule {
      width: 100%;
      height: 1px;

      margin-top: .7rem;

      background: var(--line);
    }

    .community-link-copy {
      display: block;
    }

    .community-label {
      display: block;

      color: var(--muted);

      font-family: var(--mono);

      font-size: .66rem;
      font-weight: 450;

      line-height: 1.5;

      letter-spacing: .065em;

      text-transform: uppercase;
    }

    .community-title {
      display: block;

      margin-top: .45rem;

      color: var(--fg);

      font-size:
        clamp(1.35rem, 2.2vw, 2rem);

      font-weight: 500;

      line-height: 1.1;

      letter-spacing: -.035em;

      transition:
        opacity .35s ease,
        transform .35s var(--ease);
    }

    .community-description {
      display: block;

      margin-top: .55rem;

      color: var(--secondary);

      font-size:
        clamp(.92rem, .25vw + .88rem, 1rem);

      line-height: 1.5;

      letter-spacing: -.01em;
    }

    .community-link-block:hover
      .community-title {
      transform: translateX(5px);
    }

    .community-link-block:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 10px;
    }

    .footer {
      display: grid;

      grid-template-columns: 1fr auto 1fr;

      align-items: end;

      padding-top: 1rem;

      border-top:
        1px solid var(--line-soft);

      color: var(--secondary);

      font-family: var(--mono);

      font-size: .6rem;
      font-weight: 450;

      line-height: 1.45;

      letter-spacing: .05em;

      text-transform: uppercase;

      animation:
        fade-up .9s .55s var(--ease) both;
    }

    .footer-center {
      text-align: center;
    }

    .footer-right {
      text-align: right;
    }

    @keyframes header-in {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes reveal {
      from {
        transform:
          translate3d(0, 108%, 0);
      }

      to {
        transform:
          translate3d(0, 0, 0);
      }
    }

    @media (min-width: 1600px) {
      .content {
        padding-block: 8vh;
      }
    }

    @media (max-width: 900px) {
      :root {
        --display:
          clamp(
            4rem,
            9vw,
            7.5rem
          );
      }

      .content {
        padding-block: 4rem;
      }
    }

    @media (max-width: 640px) {
      :root {
        --gutter: 1.15rem;
        --top: 1.15rem;

        --display:
          clamp(
            3.35rem,
            calc(10.2vw + 1.15rem),
            5.4rem
          );
      }

      .brand {
        font-size: .72rem;
      }

      .header-right {
        gap: .9rem;
      }

      .community-link {
        font-size: .56rem;
      }

      main {
        align-items: flex-start;
      }

      .content {
        padding-block:
          clamp(4.75rem, 12vh, 7rem)
          3.5rem;
      }

      .eyebrow {
        gap: .62rem;

        margin-bottom: 2rem;

        font-size: .6rem;
      }

      .eyebrow-rule {
        width: 1.35rem;
      }

      h1 {
        line-height: .97;
        letter-spacing: -.068em;
      }

      .hero-line {
        padding-bottom: .12em;
        margin-bottom: -.12em;
      }

      .location {
        margin-top: 3.7rem;
      }

      .location-grid,
      .community-link-block {
        grid-template-columns:
          28px
          minmax(0, 1fr);

        gap: 1rem;
      }

      .location-rule,
      .community-rule {
        margin-top: .62rem;
      }

      .location-copy {
        font-size: 1rem;
        line-height: 1.56;
      }

      .location-place,
      .community-label {
        margin-top: .72rem;

        font-size: .6rem;
      }

      .community {
        margin-top: 3.7rem;
      }

      .community-title {
        font-size: 1.35rem;
      }

      .community-description {
        font-size: .92rem;
      }

      .footer {
        grid-template-columns: 1fr 1fr;

        font-size: .57rem;
      }

      .footer-center {
        display: none;
      }
    }

    @media (max-width: 390px) {
      :root {
        --gutter: 1rem;

        --display:
          clamp(
            3.15rem,
            calc(9.8vw + 1.1rem),
            4.55rem
          );
      }

      .header-right {
        gap: .7rem;
      }

      .community-link {
        font-size: .52rem;
      }

      .eyebrow {
        font-size: .57rem;
      }

      .location-copy {
        font-size: .97rem;
      }

      .community-title {
        font-size: 1.25rem;
      }
    }

    @media
      (max-width: 640px)
      and (max-height: 700px) {

      .content {
        padding-top: 4.25rem;
      }

      .location {
        margin-top: 3rem;
      }

      .community {
        margin-top: 3rem;
      }
    }

    @media
      (max-width: 900px)
      and (orientation: landscape)
      and (max-height: 600px) {

      .content {
        padding-block: 3rem;
      }

      :root {
        --display:
          clamp(
            3.4rem,
            8vw,
            6.4rem
          );
      }

      .location {
        margin-top: 2.7rem;
      }

      .community {
        margin-top: 2.7rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      .hero-line-inner {
        transform: none;
      }
    }

    @media (prefers-contrast: more) {
      :root {
        --secondary: #c2c1bb;
        --muted: #9d9c96;
        --line: #3a3a37;
      }
    }

    @media print {
      body {
        background: white;
        color: black;
      }

      .page {
        min-height: auto;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="header">

      <a
        class="brand"
        href="/"
        aria-label="Cesare Paratore — pagina principale"
      >
        CESARE PARATORE
      </a>

      <div class="header-right">

        <a
          class="community-link"
          href="/community/"
          aria-label="Vai alla sezione Comunità"
        >
          Comunità
        </a>

      </div>

    </header>


    <main>

      <section
        class="content"
        aria-labelledby="main-title"
      >

        <div class="eyebrow">

          <span>
            Sito personale
          </span>

          <span
            class="eyebrow-rule"
            aria-hidden="true"
          ></span>

          <span>
            2026
          </span>

        </div>


        <h1 id="main-title">

          <span class="hero-line">
            <span class="hero-line-inner">
              Cesare
            </span>
          </span>

          <span class="hero-line">
            <span class="hero-line-inner">
              Paratore.
            </span>
          </span>

        </h1>


        <section
          class="location"
          aria-label="Identità e località"
        >

          <div class="location-grid">

            <div
              class="location-rule"
              aria-hidden="true"
            ></div>

            <div>

              <p class="location-copy">

                <strong>
                  Uno spazio personale.
                </strong>

                Un'identità digitale.

              </p>

              <span class="location-place">
                Partinico / Sicilia / Italia
              </span>

            </div>

          </div>

        </section>


        <section
          class="community"
          aria-label="Comunità"
        >

          <a
            class="community-link-block"
            href="/community/"
            aria-label="Scopri la Comunità"
          >

            <div
              class="community-rule"
              aria-hidden="true"
            ></div>

            <div class="community-link-copy">

              <span class="community-label">
                Comunità
              </span>

              <span class="community-title">
                Partinico / Digital Community
              </span>

              <span class="community-description">
                Uno spazio dedicato alla comunità locale.
              </span>

            </div>

          </a>

        </section>

      </section>

    </main>


    <footer class="footer">

      <div>
        © 2026 Cesare Paratore
      </div>

      <div class="footer-center">
        Partinico / Sicilia
      </div>

      <div class="footer-right">
        Sito personale — 01 / 01
      </div>

    </footer>

  </div>

</body>
</html>
