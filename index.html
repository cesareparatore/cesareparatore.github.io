<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesare Paratore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #f5f5f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 40px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 640px;
      width: 100%;
    }

    .brand {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #86868b;
      margin-bottom: 32px;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: #f5f5f7;
      margin-bottom: 24px;
    }

    h1 strong {
      font-weight: 600;
      color: #ffffff;
    }

    p {
      font-size: 1.15rem;
      font-weight: 300;
      line-height: 1.5;
      color: #86868b;
      max-width: 440px;
    }

    .line {
      width: 32px;
      height: 1px;
      background-color: #333336;
      margin-top: 48px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand">Cesare Paratore</div>
    <h1>Progettato per la <strong>prestazione.</strong></h1>
    <p>Il nuovo portale di biomeccanica e preparazione atletica è in fase di sviluppo.</p>
    <div class="line"></div>
  </div>

</body>
</html>
